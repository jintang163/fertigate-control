service:
  name: growth-model-service
  host: 0.0.0.0
  port: 8081
  log_level: INFO

spring_boot:
  base_url: http://localhost:8080/api
  timeout: 30
  retry_attempts: 3
  retry_delay: 2

decision:
  check_interval_seconds: 60
  default_irrigation_duration: 1800
  min_irrigation_duration: 300
  max_irrigation_duration: 7200
  flow_rate_lpm: 10
  enable_auto_callback: true

crops:
