version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fertigate-postgres
    environment:
      POSTGRES_DB: fertigate
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: fertigate123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fertigate-net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: fertigate-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: fertigate123
      DOCKER_INFLUXDB_INIT_ORG: fertigate
      DOCKER_INFLUXDB_INIT_BUCKET: sensor_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: fertigate-token-2024
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - fertigate-net

  emqx:
    image: emqx/emqx:5.3
    container_name: fertigate-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      EMQX_ADMIN_PASSWORD: fertigate123
    volumes:
      - emqx-data:/opt/emqx/data
    networks:
      - fertigate-net

volumes:
  postgres-data:
  influxdb-data:
  emqx-data:

networks:
  fertigate-net:
    driver: bridge
